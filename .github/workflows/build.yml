name: Build NetHunter modules (fleur, ROM-kernel ABI match)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev cpio zip curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo mkdir -p /opt/a64bin /opt/a64gcc/bin
          sudo ln -sf /usr/bin/aarch64-linux-gnu-as /opt/a64bin/aarch64-linux-gnu-as
          for t in as ld ar nm objcopy objdump readelf strip ranlib size strings; do
            sudo ln -sf /usr/bin/aarch64-linux-gnu-$t /opt/a64gcc/bin/aarch64-linux-gnu-$t
          done

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Clone kernel source (ROM commit 5bf0cec8e008)
        run: |
          git init kernel
          cd kernel
          git remote add origin https://github.com/mt6781-devs/android_kernel_xiaomi_mt6781.git
          git fetch --depth=1 origin 5bf0cec8e008920949b01439d898441c2ec953e9
          git checkout FETCH_HEAD

      - name: Download Android clang r530567 (exact ROM build toolchain)
        run: |
          curl -sSL -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz"
          mkdir -p "$HOME/tc"
          tar -xzf clang.tar.gz -C "$HOME/tc"
          "$HOME/tc/bin/clang" --version | head -2
          "$HOME/tc/bin/ld.lld" --version | head -1

      - name: Configure kernel (ROM live config + NetHunter fragment)
        run: |
          cd kernel
          mkdir -p out
          cp ../rom_kernel_config out/.config
          make O=out ARCH=arm64 olddefconfig
          cat ../nethunter.config >> out/.config
          make O=out ARCH=arm64 olddefconfig
          echo '=== sanity ==='
          grep -E 'CONFIG_(LTO_NONE|LTO_CLANG|MODVERSIONS|MAC80211|RTL8XXXU|RT2800USB|USB_NET_QMI_WWAN|MODULES)=|CONFIG_MAC80211 ' out/.config | sort || true

      - name: Build kernel + modules (clang r530567, no LTO)
        run: |
          cd kernel
          TC=$HOME/tc/bin
          export PATH=$TC:/opt/a64bin:$PATH
          set -o pipefail
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            HOSTCC=gcc HOSTCXX=g++ HOSTAR=ar HOSTLD=ld \
            CROSS_COMPILE=/opt/a64gcc/bin/aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -w" \
            LOCALVERSION="-g5bf0cec8e008920949b01439d898441c2ec953e9" \
            -j"$(nproc)" 2>&1 | tee ../build.log
          ls -la out/Module.symvers

      - name: Build rtl8812au (88XXau.ko - Archer T2U Plus RTL8811AU)
        run: |
          TC=$HOME/tc/bin
          export PATH=/opt/a64bin:$PATH
          git clone -q --depth=1 -b v5.13.6 https://github.com/aircrack-ng/rtl8812au.git
          grep -rl "extern int console_suspend_enabled" rtl8812au \
            | xargs -r sed -i 's/extern int console_suspend_enabled/extern bool console_suspend_enabled/'
          set -o pipefail
          make -C rtl8812au ARCH=arm64 KSRC=$GITHUB_WORKSPACE/kernel/out \
            CC=$TC/clang LD=$TC/ld.lld CROSS_COMPILE=/opt/a64gcc/bin/aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -w" -j"$(nproc)" 2>&1 | tee rtl8812au.log
          find rtl8812au -name '*.ko' -print

      - name: Package (Magisk module with drivers)
        run: ./package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-fleur
          path: |
            out/*.zip
            out/*.config
            out/Module.symvers
            out/*.log
          if-no-files-found: error
